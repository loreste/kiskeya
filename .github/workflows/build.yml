name: Build Kiskeya Softphone

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Client
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: universal
          - os: windows-latest
            platform: windows
            arch: amd64
          - os: ubuntu-latest
            platform: linux
            arch: amd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # Install Linux-specific GUI and audio dependencies
      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libasound2-dev \
            pkg-config \
            build-essential

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Application
        shell: bash
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          # Run wails build for specific platform
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            wails build -platform darwin/universal
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            wails build -platform windows/amd64
          else
            wails build -platform linux/amd64
          fi

      - name: Upload Artifacts (macOS)
        if: matrix.platform == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: Kiskeya-macOS
          path: build/bin/kiskeya.app

      - name: Upload Artifacts (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Kiskeya-Windows
          path: build/bin/kiskeya.exe

      - name: Upload Artifacts (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: Kiskeya-Linux
          path: build/bin/kiskeya
