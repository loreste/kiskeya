name: Build Kiskeya Softphone

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Client
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: universal
          - os: windows-latest
            platform: windows
            arch: amd64
          - os: ubuntu-latest
            platform: linux
            arch: amd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        shell: bash
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # Install Linux GUI/audio deps. ubuntu-latest is now 24.04, which ships
      # webkit2gtk 4.1 (the 4.0 -dev package was removed); Wails builds against
      # it with the webkit2_41 build tag (see Build Application below).
      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            pkg-config \
            build-essential

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Prepare Windows Installer Resources
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $resourceDir = "build\windows\installer\resources"
          New-Item -ItemType Directory -Force -Path $resourceDir
          Copy-Item LICENSE "$resourceDir\LICENSE.txt"
          # Create a 164x314 BMP welcome banner from the app icon using magick
          magick build\appicon.png -resize 164x164 -gravity center -background "#1c2127" -extent 164x314 BMP3:"$resourceDir\welcome.bmp"

      - name: Build Application
        shell: bash
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            wails build -platform darwin/universal
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            wails build -platform windows/amd64 -nsis
          else
            # webkit2_41 tag is required for webkit2gtk 4.1 on Ubuntu 24.04+
            wails build -platform linux/amd64 -tags webkit2_41
          fi

      - name: Create DMG Installer (macOS)
        if: matrix.platform == 'darwin'
        run: |
          brew install create-dmg
          # create-dmg returns exit code 2 when it can't set a custom icon but
          # the DMG was still created successfully — treat that as success.
          create-dmg \
            --volname "Kiskeya Installer" \
            --volicon "build/appicon.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "kiskeya.app" 150 185 \
            --hide-extension "kiskeya.app" \
            --app-drop-link 450 185 \
            --eula LICENSE \
            "build/bin/Kiskeya-Installer.dmg" \
            "build/bin/kiskeya.app" \
          || test $? -eq 2

      - name: Upload Artifacts (macOS)
        if: matrix.platform == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: Kiskeya-macOS
          path: build/bin/Kiskeya-Installer.dmg

      - name: Upload Artifacts (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Kiskeya-Windows
          path: build/bin/kiskeya-amd64-installer.exe

      - name: Build Linux Packages (deb + rpm)
        if: matrix.platform == 'linux'
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          export VERSION=${{ steps.version.outputs.version }}
          nfpm package --packager deb --target build/bin/
          nfpm package --packager rpm --target build/bin/

      - name: Upload Artifacts (Linux deb)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: Kiskeya-Linux-deb
          path: build/bin/*.deb

      - name: Upload Artifacts (Linux rpm)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: Kiskeya-Linux-rpm
          path: build/bin/*.rpm

  release:
    name: Create GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare Release Files
        run: |
          mkdir -p dist
          cp release-assets/Kiskeya-macOS/Kiskeya-Installer.dmg dist/Kiskeya-${{ steps.version.outputs.version }}-macOS.dmg
          cp release-assets/Kiskeya-Windows/kiskeya-amd64-installer.exe dist/Kiskeya-${{ steps.version.outputs.version }}-Windows-amd64-installer.exe
          cp release-assets/Kiskeya-Linux-deb/*.deb dist/
          cp release-assets/Kiskeya-Linux-rpm/*.rpm dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Kiskeya v${{ steps.version.outputs.version }}
          body: |
            ## Kiskeya v${{ steps.version.outputs.version }}

            ### Downloads
            - **macOS**: `Kiskeya-${{ steps.version.outputs.version }}-macOS.dmg` (Universal — Intel + Apple Silicon)
            - **Windows**: `Kiskeya-${{ steps.version.outputs.version }}-Windows-amd64-installer.exe`
            - **Debian/Ubuntu**: `.deb` package — install with `sudo dpkg -i <file>.deb`
            - **RHEL/Fedora**: `.rpm` package — install with `sudo dnf install <file>.rpm`
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
